<!DOCTYPE html>
<html lang="en">
<head>
    <title>TaskFlow – Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-left">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-list-check"></i></div>
            <span class="brand-name">TaskFlow</span>
        </div>
        <h2>Organize your tasks,<br>boost your productivity.</h2>
        <div class="auth-illustration">
            <div class="illustration-card"><div class="ill-icon green"><i class="fa-solid fa-check"></i></div><span>Design landing page</span></div>
            <div class="illustration-card"><div class="ill-icon pink"><i class="fa-solid fa-spinner"></i></div><span>Build REST APIs</span></div>
            <div class="illustration-card"><div class="ill-icon orange"><i class="fa-solid fa-clock"></i></div><span>Write unit tests</span></div>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <h1>Create Account 🚀</h1>
            <p class="auth-subtitle">Fill in the details to get started</p>
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye toggle-pw" onclick="togglePw('password', this)"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm_password" placeholder="Confirm your password">
                        <i class="fa-solid fa-eye toggle-pw" onclick="togglePw('confirm_password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</div>
<script>
function togglePw(id, el) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    el.classList.toggle('fa-eye'); el.classList.toggle('fa-eye-slash');
}
</script>
</body>
</html>
